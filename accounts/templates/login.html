<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Story App</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">

            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-white">
                    Welcome Back
                </h1>

                <p class="text-slate-400 mt-2">
                    Login to continue your stories
                </p>

            </div>

            <form method="POST" class="space-y-5">

                {% csrf_token %}

                <!-- Username -->
                <div>

                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        placeholder="Enter username"
                        class="w-full px-4 py-3 rounded-lg bg-slate-800
                               border border-slate-700
                               text-white placeholder-slate-500
                               focus:outline-none focus:ring-2
                               focus:ring-blue-500">

                </div>


                <!-- Password -->
                <div>

                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        placeholder="Enter password"
                        class="w-full px-4 py-3 rounded-lg bg-slate-800
                               border border-slate-700
                               text-white placeholder-slate-500
                               focus:outline-none focus:ring-2
                               focus:ring-blue-500">

                </div>


                <!-- Login button -->

                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700
                           text-white font-semibold
                           py-3 rounded-lg transition">

                    Login

                </button>

            </form>


            <p class="text-center text-slate-400 mt-6">

                Don't have an account?

                <a
                    href="{% url 'register' %}"
                    class="text-blue-400 hover:text-blue-300 font-medium">

                    Register

                </a>

            </p>

        </div>

    </div>

</body>

</html>
